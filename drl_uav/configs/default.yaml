seed: 42
device: cpu

env:
  map_size: 40
  area_km2: 4.0
  dt: 1.0
  max_steps: 1000
  wind_level: 0
  num_vortices: 0
  vortex_strength: 8.0
  coverage_target: 0.95

model:
  obs_dim: 36
  grid_dim: 1600
  action_dim: 3
  hidden_size: 128
  lstm_layers: 1
  attention_heads: 4

ppo:
  total_updates: 20
  steps_per_update: 512
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  lr: 3.0e-4
  batch_size: 128
  epochs: 4
  max_grad_norm: 0.5

curriculum:
  - { wind_level: 0, num_vortices: 0, updates: 5 }
  - { wind_level: 1, num_vortices: 1, updates: 5 }
  - { wind_level: 2, num_vortices: 2, updates: 5 }
  - { wind_level: 3, num_vortices: 3, updates: 5 }
